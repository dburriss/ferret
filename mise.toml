[tools]
hyperfine = "latest"

[tasks."fetch:corpus"]
description = "Fetch BEIR datasets into corpus/ (args: scifact|nfcorpus, default both)"
run = "dotnet fsi scripts/fetch-corpus.fsx"

[tasks."fetch:perf"]
description = "Shallow-clone the perf corpora into benchmarks/data/ (several GB)"
run = "dotnet fsi benchmarks/fetch.fsx"

[tasks."build:ferret"]
hide = true
run = "dotnet build -c Release src/Ferret"

[tasks."build:cli"]
hide = true
run = "dotnet build -c Release src/Ferret.Cli"

[tasks."eval:relevance"]
description = "nDCG/recall/MRR vs benchmarks/relevance-baseline.json (args: [scifact|nfcorpus|fsharp-docs] [--update], default all)"
depends = ["build:ferret"]
run = "dotnet fsi scripts/eval-relevance.fsx"

[tasks.bench]
description = "Time rg vs ferret with hyperfine (optional arg: runs)"
depends = ["build:cli"]
run = "dotnet fsi benchmarks/run.fsx"

[tasks.bootstrap]
description = "Set up the repo: restore packages and fetch the BEIR and F# docs test corpora (no multi-GB perf clones)"
depends = ["restore", "fetch:corpus", "fetch:fsharp-docs"]

[tasks."bootstrap:all"]
description = "bootstrap plus the multi-GB perf clones"
depends = ["bootstrap", "fetch:perf"]

[tasks.restore]
hide = true
run = "dotnet restore"

[tasks."fetch:fsharp-docs"]
description = "Fetch the F# docs (dotnet/docs, docs/fsharp, pinned) into corpus/fsharp-docs/"
run = "dotnet fsi scripts/fetch-fsharp-docs.fsx"
