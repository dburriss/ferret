<svg xmlns="http://www.w3.org/2000/svg" width="480" height="170" viewBox="0 0 480 170" role="img" aria-labelledby="t">
  <title id="t">Ferret</title>
  <style>
    .frame { stroke: #8a5a3c; fill: none; stroke-width: 8; }
    .lens { fill: #fff6e6; }
    .word { fill: #3b2a20; }
    .tag { fill: #8a5a3c; }
    @media (prefers-color-scheme: dark) {
      .lens { fill: #2e2520; }
      .frame { stroke: #d09a6a; }
      .handle { stroke: #d09a6a; }
      .word { fill: #f3e6d6; }
      .tag { fill: #d09a6a; }
    }
  </style>
  <!-- handle -->
  <line class="handle" x1="118" y1="114" x2="152" y2="148" stroke="#8a5a3c" stroke-width="13" stroke-linecap="round"/>
  <!-- lens -->
  <circle class="lens" cx="80" cy="76" r="54"/>
  <!-- ears -->
  <circle cx="53" cy="47" r="10" fill="#b98255"/>
  <circle cx="107" cy="47" r="10" fill="#b98255"/>
  <circle cx="53" cy="48" r="4.5" fill="#f0bfb5"/>
  <circle cx="107" cy="48" r="4.5" fill="#f0bfb5"/>
  <!-- head -->
  <ellipse cx="80" cy="80" rx="33" ry="28" fill="#cf9d6a"/>
  <!-- bandit mask -->
  <ellipse cx="80" cy="75" rx="29" ry="10.5" fill="#5e3e2c"/>
  <circle cx="68" cy="75" r="3.8" fill="#140e0b"/>
  <circle cx="92" cy="75" r="3.8" fill="#140e0b"/>
  <circle cx="69.2" cy="73.8" r="1.2" fill="#fff"/>
  <circle cx="93.2" cy="73.8" r="1.2" fill="#fff"/>
  <!-- muzzle -->
  <ellipse cx="80" cy="92" rx="14" ry="10" fill="#fff1dc"/>
  <path d="M75.5 87.5 h9 l-4.5 5 z" fill="#d98585"/>
  <path d="M80 92.5 v3 M80 95.5 q-4 3.5 -8 .5 M80 95.5 q4 3.5 8 .5" fill="none" stroke="#5e3e2c" stroke-width="1.5" stroke-linecap="round"/>
  <!-- rim (on top) -->
  <circle class="frame" cx="80" cy="76" r="54"/>
  <!-- wordmark -->
  <text class="word" x="180" y="92" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="68" font-weight="700" letter-spacing="-1">ferret</text>
  <text class="tag" x="183" y="122" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="16" letter-spacing="0.5">ranked search for your files</text>
</svg>
